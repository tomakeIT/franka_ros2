/**: 
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz

      fr3_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

/**:
  franka_robot_state_broadcaster:
    ros__parameters:
      lock_try_count: 5 # Number of attempts to acquire the lock in a single on_update()
      lock_sleep_interval: 5 # microseconds sleep between attempts
      lock_log_error: false #  Log error if lock acquisition fails - false == do not log  
      lock_update_success: true # return update OK, although lock fails (no update occurs)
      
/**: 
  fr3_arm_controller:
    ros__parameters:
      command_interfaces:
        - position  # 改为位置控制，适合假硬件
      state_interfaces:
        - position
        - velocity
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
      # 位置控制的约束参数
      allow_partial_joints_goal: false
      open_loop_control: true
      allow_integration_in_goal_trajectories: true
      constraints:
        stopped_velocity_tolerance: 0.01
        goal_time: 0.6
        fr3_joint1:
          trajectory: 0.1
          goal: 0.1
        fr3_joint2:
          trajectory: 0.1
          goal: 0.1
        fr3_joint3:
          trajectory: 0.1
          goal: 0.1
        fr3_joint4:
          trajectory: 0.1
          goal: 0.1
        fr3_joint5:
          trajectory: 0.1
          goal: 0.1
        fr3_joint6:
          trajectory: 0.1
          goal: 0.1
        fr3_joint7:
          trajectory: 0.1
          goal: 0.1
